# Static deployment to GitHub Pages.
#
# Only `main` deploys. Use `develop` for work in progress so the published
# site always reflects an approved state.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Before launch, set the repository variable SITE_MODE to "holding".
      # The root then serves a holding page and the real site is built under
      # /preview. Clear SITE_MODE to publish normally.
      - name: Resolve build mode
        id: mode
        run: |
          if [ "${{ vars.SITE_MODE }}" = "holding" ]; then
            echo "holding=true" >> "$GITHUB_OUTPUT"
            echo "base_path=/preview" >> "$GITHUB_OUTPUT"
          else
            echo "holding=false" >> "$GITHUB_OUTPUT"
            echo "base_path=${{ vars.BASE_PATH }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          EXPORT: "1"
          # BASE_PATH is /<repo-name> on a project page, /preview while the
          # holding page is up, and empty on a custom domain at launch.
          BASE_PATH: ${{ steps.mode.outputs.base_path }}
          # Also exposed to the app: <Image> needs it explicitly, because
          # unoptimized images bypass Next's automatic basePath handling.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.mode.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SITE_MODE: ${{ vars.SITE_MODE }}
        run: npm run build:export

      - name: Assemble holding layout
        if: steps.mode.outputs.holding == 'true'
        run: |
          # Invoked through bash rather than relying on the executable
          # bit, which Windows does not preserve when files are copied.
          bash scripts/assemble-holding.sh out site
          rm -rf out
          mv site out
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
